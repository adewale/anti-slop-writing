name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # The validator tests run scripts/validate.py on a copy of the repo. Open
      # PR #19 makes validate.py fail under CI when skills-ref is missing, so
      # install the same pin it uses.
      - name: Install the Agent Skills reference validator
        run: python3 -m pip install skills-ref==0.1.1
      - name: Unit tests for eval scripts, oracles and validators
        run: python3 -m unittest discover -s tests -v
